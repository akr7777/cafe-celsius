<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FAF7F2" />

  <!-- thin temperature-scale motif -->
  <line x1="150" y1="470" x2="1050" y2="470" stroke="#E3DCD1" stroke-width="1" />
  <g fill="#0B2FA6">
    <circle cx="330" cy="470" r="3" />
    <circle cx="600" cy="470" r="3" />
    <circle cx="870" cy="470" r="3" />
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#6B645B" text-anchor="middle">
    <text x="330" y="500">4 &#176;C</text>
    <text x="600" y="500">65 &#176;C</text>
    <text x="870" y="500">93 &#176;C</text>
  </g>

  <!-- wordmark -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="600" y="330" font-weight="800" font-size="120" letter-spacing="6" fill="#1C1A17">CELSIUS</text>
    <text x="885" y="270" font-weight="700" font-size="46" fill="#0B2FA6">&#176;C</text>
  </g>
  <text x="600" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="30" fill="#6B645B">
    Caf&#233; de sp&#233;cialit&#233; &#183; Paris
  </text>
</svg>
